syntax = "proto3";

package rpc;
option go_package="./user";

message User {
  int64 id = 1;
  int64 roleId = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string weChat = 6;
  string motto = 7;
  string avatar = 8;
  string profileBg = 9;
  int32 age = 10;
  int32 gender = 11;
  int32 status = 12;
  string location = 13;
  int32 level = 14;
  int32 score = 15;
  int64 createdAt = 16;
  int64 updatedAt = 17;
}

message RegisterReq {
  string email = 1;
  string authType = 2;
  string nickname = 3;
  string password = 4;
}

message RegisterResp {
  User user = 1;
}

message LoginReq {
  string email = 1;
  string phone = 2;
  string nickname = 3;
  string password = 4;
}

message LoginResp {
  string accessToken = 1;
  string refreshToken = 2;
  int64 expireAt = 3;
}

message GetUserInfoReq {
  int64 id = 1;
}

message GetUserInfoResp {
  User user = 1;
}


service Rpc {
  rpc Register(RegisterReq) returns(RegisterResp);
  rpc Login(LoginReq) returns(LoginResp);
  rpc GetUserInfo(GetUserInfoReq) returns(GetUserInfoResp);
}
