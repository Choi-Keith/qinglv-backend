syntax = "proto3";

package user;
option go_package="./user";


message RoleItem {
    uint64 id = 1;
    string name = 2;
    uint64 createdAt = 3;
    uint64 updatedAt = 4;
}

message GetRoleInfoReq {
    uint64 id = 1;
}

message GetRoleInfoResp {
    RoleItem Role = 1;
}


message UserItem {
  uint64 id = 1;
  uint64 roleId = 2;
  string nickname = 3;
  string email = 4;
  string phone = 5;
  string weChat = 6;
  string motto = 7;
  string avatar = 8;
  string profileBg = 9;
  int32 age = 10;
  int32 gender = 11;
  int32 status = 12;
  string location = 13;
  int32 level = 14;
  int32 score = 15;
  uint64 createdAt = 16;
  uint64 updatedAt = 17;
  int32 authType = 18;
}

message RegisterReq {
  uint64 id = 1;
  uint64 roleId = 2;
  string nickname = 3;
  string email = 4;
  string password = 5;
  string phone = 6;
  int32 authType = 7;
}

message RegisterResp {
  UserItem user = 1;
}

message LoginReq {
  string email = 1;
  string phone = 2;
  string nickname = 3;
  string password = 4;
}

message LoginResp {
  string accessToken = 1;
  string refreshToken = 2;
  int64 expireAt = 3;
}

message GetUserInfoReq {
  uint64 id = 1;
}

message GetUserInfoResp {
  UserItem user = 1;
}

message GetUserInfoNicknameReq{
  string nickname = 1;
}

message GetUserInfoEmailReq {
  string email = 1;
}

message GetUserListReq {
  int32 pageNum = 1;
  int32 pageSize = 2;
  string nickname = 3;
  string email = 4;
  int32 status = 5;
}

message GetUserListResp {
  uint64 total = 1;
  repeated UserItem data = 2;
}

service User {
  // group: role
  rpc GetRoleInfo(GetRoleInfoReq) returns(GetRoleInfoResp);
  // group: user
  rpc Register(RegisterReq) returns(RegisterResp);
  // group: user
  rpc Login(LoginReq) returns(LoginResp);
  // group: user
  rpc GetUserInfo(GetUserInfoReq) returns(GetUserInfoResp);
  // group: user
  rpc GetUserInfoByNickname(GetUserInfoNicknameReq) returns(GetUserInfoResp);
  // group: user
  rpc GetUserInfoByEmail(GetUserInfoEmailReq) returns(GetUserInfoResp);
  rpc GetUserList(GetUserListReq) returns(GetUserListResp);
}

