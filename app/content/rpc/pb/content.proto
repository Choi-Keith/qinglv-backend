}
message AddCategoryReq {
    uint64 id  = 1;
    uint64 creatorId = 2;
   	string name = 3; 
	string image = 4;          
	string description = 5;
    uint64 quoteCount = 6;
}
message DeleteCategoryReq {
    uint64 id = 1;
}
message UpdateCategoryReq {
    uint64 id  = 1;
   	string name = 3; 
	string image = 4;          
	string description = 5;
    uint64 quoteCount = 6;
}
message GetCategoryDetailReq {
    uint64 id = 1;
}
message GetCategoryDetailResp {
    CategoryItem category  = 1;
}
message GetCategoryListReq {
    string name = 1;
    uint64 creatorId = 2;
