syntax = "proto3";

package content;
option go_package="./content";

message OkResp {
    string pong = 1;
}

//==========================Topic==========================
message TopicItem {
    uint64 id  = 1;
    uint64 creatorId = 2;
   	string name = 3; 
	string bg = 4;          
	string description = 5;
    uint64 quoteCount = 6; 
    uint64 createdAt = 7;
    uint64 updatedAt = 8;
    int32 type = 9;
    double score = 10;
}
message AddTopicReq {
    uint64 id  = 1;
    uint64 creatorId = 2;
   	string name = 3; 
	string bg = 4;          
	string description = 5;
    uint64 quoteCount = 6;
    int32 type = 7;
    double score = 8;
}
message DeleteTopicReq {
    uint64 id = 1;
}
message UpdateTopicReq {
    uint64 id  = 1;
   	string name = 3; 
	string bg = 4;          
	string description = 5;
    uint64 quoteCount = 6;
    int32 type = 7;
    double score = 8;
}
message GetTopicByIdReq {
    uint64 id = 1;
}
message GetTopicByIdResp {
    TopicItem topic  = 1;
}
message GetTopicByNameReq {
    string name = 1;
}
message GetTopicByNameResp {
    TopicItem topic  = 1;
}
message GetTopicListReq {
    string name = 1;
    uint64 creatorId = 2;
    uint64 quoteCount = 3;
    uint64 pageNum = 4;
    uint64 pageSize = 5;
    int32 type = 6;
    string sort = 7;
}
message GetTopicListResp {
    repeated TopicItem data = 1;
    uint64 total = 2;
}
service TopicClass {
    // group: topic
    rpc AddTopic(AddTopicReq) returns(OkResp);
    // group: topic
    rpc DeleteTopic(DeleteTopicReq) returns(OkResp);
    // group: topic
    rpc UpdateTopic(UpdateTopicReq) returns(OkResp);
    // group: topic
    rpc GetTopicById(GetTopicByIdReq) returns(GetTopicByIdResp);
    // group: topic
    rpc GetTopicByName(GetTopicByNameReq) returns(GetTopicByNameResp);
    // group: topic
    rpc GetTopicList(GetTopicListReq) returns(GetTopicListResp);
}


//==========================Category==========================
