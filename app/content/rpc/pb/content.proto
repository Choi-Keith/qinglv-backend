//==========================Post==========================
message PostItem {
    uint64 id  = 1;
    uint64 creatorId = 2;
    int32 status = 3;
    int32 visibility = 4;
    int32 isTop = 5;
    double score = 6;
    string location = 7;
    uint64 commentCount = 8;    
    uint64 collectionCount = 9;    
    uint64 likeCount = 10;    
    uint64 dislikeCount = 11;    
    uint64 shareCount = 12;    
    uint64 lastReplyTime = 13;
    uint64 createdAt = 14;
    uint64 updatedAt = 15;
}
message AddPostReq {
    uint64 id  = 1;
    uint64 creatorId = 2;
   	int32 status = 3; 
	int32 visibility = 4;          
	int32 isTop = 5;
    string location = 6;
}
message DeletePostReq {
    uint64 id = 1;
    uint64 postContentId = 2;
}
message UpdatePostReq {
    uint64 id  = 1;
    uint64 creatorId = 2;
   	int32 status = 3; 
	int32 visibility = 4;          
	int32 isTop = 5;
    string location = 6;
    double score = 7;
    uint64 commentCount = 8;    
    uint64 collectionCount = 9;    
    uint64 likeCount = 10;    
    uint64 dislikeCount = 11;    
    uint64 shareCount = 12;    
}
message GetPostDetailReq {
    uint64 id = 1;
}
message GetPostDetailResp {
    PostItem post  = 1;
}
message GetPostListReq {
    int32 status = 1;
    repeated int32 visibility = 2;
    int32 isTop = 3;
    double score = 4;
    string location = 5;
    string keyword = 6; 
    uint64 creatorId = 7;
    uint64 pageNum = 8;
    uint64 pageSize = 9;
    string sort = 10;
}
message GetPostListResp {
    repeated PostItem data = 1;
    uint64 total = 2;
}
service PostClass {
    rpc AddPost(AddPostReq) returns(OkResp);
    rpc DeletePost(DeletePostReq) returns(OkResp);
    rpc UpdatePost(UpdatePostReq) returns(OkResp);
    rpc GetPostDetail(GetPostDetailReq) returns(GetPostDetailResp);
    rpc GetPostList(GetPostListReq) returns(GetPostListResp);
    rpc AddPostContent(AddPostContentReq) returns(OkResp);
    rpc GetPostContentByPostId(GetPostContentDetailReq) returns(GetPostContentDetailResp);
}


//==========================PostContent==========================
message PostContentItem {
    uint64 id = 1;
    uint64 postId = 2;
    uint64 categoryId = 3;
    string topics = 4;
   	string content = 5; 
	repeated string images = 6;  
    uint64 creatorId = 7;
    uint64 createdAt = 8;
    uint64 updatedAt = 9;
}
message AddPostContentReq {
    uint64 id  = 1;
    uint64 creatorId = 2;
   	uint64 postId = 3; 
	uint64 categoryId = 4;          
	string topics = 5;
    string content = 6;
    repeated string images = 7;
}

message GetPostContentDetailReq {
    uint64 id = 1;
}
message GetPostContentDetailResp {
    PostContentItem postContent  = 1;
}
message GetPostContentListReq {
    string content = 1; 
    uint64 creatorId = 2;
    uint64 categoryId = 3;
    uint64 pageNum = 4;
    uint64 pageSize = 5;
}
message GetPostContentListResp {
    repeated PostContentItem data = 1;
    uint64 total = 2;
}

//==========================MediaFile==========================

message MediaFile {
    uint64 id = 1;
    uint64 creatorId = 2;
    uint64 fileSize = 3;
    int32 mediaType = 4;
    int32 bizType = 5;
    string content = 6;
    uint64 createdAt = 7;
    uint64 updatedAt = 8;
}
message AddMediaFileReq {
    uint64 id = 1;
    uint64 creatorId = 2;
    uint64 fileSize = 3;
    int32 mediaType = 4;
    int32 bizType = 5;
    string content = 6;
}
message DeleteMediaFileReq{
    uint64 id = 1;
}
message GetMediaFileByContentReq{
    string content = 1;
}
message GetMediaFileByContentResp {
    MediaFile file = 1;
}
message GetMediaFileListReq {
    string content = 1;
    uint64 creatorId = 3;
}
message GetMediaFileListResp {
    repeated MediaFile Data = 1;
    uint64 total = 2;
}

service MediaFileClass {
    // group: mediaFile
    rpc AddMediaFile(AddMediaFileReq) returns(OkResp);
    // group: mediaFile
    rpc DeleteMediaFile(DeleteMediaFileReq) returns(OkResp);
    // group: mediaFile
    rpc GetMediaFileByContent(GetMediaFileByContentReq) returns(GetMediaFileByContentResp);
    // group: mediaFile
    rpc GetMediaFileList(GetMediaFileListReq) returns(GetMediaFileListResp);
}

