<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻旅社区-重置密码</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-size: 14px;
        }
        .container {
            margin-top: 40px;
            padding: 4px 16px;
            min-height: 100vh;
        }
        .container h2 {
            margin-bottom: 24px;
            font-size:22px;
            text-align: center;
            color: #02c980;
        }

        .container .btn {
            width: 140px;
            margin-bottom: 24px;
        }

        .container .btn a {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 8px 16px;
            margin-top: 12px;
            font-size: 14px;
            background-color: #02c980;
            color: #fff;
            border-radius: 2px;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>重置密码</h2>
            <p>有人想重置您在<strong>《轻旅社区》</strong>的密码，如果不是您的操作，您可以放心地忽略它</p>
            <p style="margin-top: 12px">否则，则点击下面的按钮</p>
            <div class="btn">
                <a href="{{.RegisterUrl}}" target="_blank">重置密码</a>
            </div>
            <p>出于安全性考虑，此链接将仅激活10分钟。</p>
        </div>
    </div>
</body>
</html>
